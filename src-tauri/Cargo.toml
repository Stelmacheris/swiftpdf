[package]
name = "swiftpdf"
description = "SwiftPDF: a fast, private PDF viewer and editor for Windows."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true
default-run = "swiftpdf"

[lib]
# The `_lib` suffix avoids a name clash between the lib and bin targets on Windows.
name = "swiftpdf_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
swiftpdf-core = { path = "../crates/swiftpdf-core" }

[dev-dependencies]
serde_json = "1"
